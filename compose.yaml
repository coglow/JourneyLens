name: journeylens_dev

services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: journeylens_dev
      POSTGRES_USER: journeylens_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored root .env file}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  postgres_data:
    name: journeylens-dev-pgdata
